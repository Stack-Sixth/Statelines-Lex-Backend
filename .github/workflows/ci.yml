name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check

  postgresql17-integration:
    name: PostgreSQL 17 integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lex
          POSTGRES_PASSWORD: lex_ci_only
          POSTGRES_DB: lex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lex:lex_ci_only@localhost:5432/lex_test
      TEST_DATABASE_URL: postgresql://lex:lex_ci_only@localhost:5432/lex_test
      DATABASE_SSL: 'false'
      DOMAIN_READ_API_ENABLED: 'false'
      MERCHANT_DOMAIN_API_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Create ephemeral migration-runner client config
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          import { appendFile } from 'node:fs/promises';
          const client = {
            id: 'ci-migration-runner',
            secret: randomBytes(32).toString('hex'),
            roles: ['admin'],
          };
          process.stdout.write(`::add-mask::${client.secret}\n`);
          await appendFile(process.env.GITHUB_ENV, `API_CLIENTS_JSON=${JSON.stringify([client])}\n`);
          NODE
      - name: Build production migration runner
        run: npm run build
      - name: Wait for PostgreSQL 17
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL, connectionTimeoutMillis: 1000 });
          const deadline = Date.now() + 30000;
          let connected = false;
          try {
            while (Date.now() < deadline) {
              try {
                await pool.query('SELECT 1');
                connected = true;
                break;
              } catch {
                await new Promise((resolve) => setTimeout(resolve, 1000));
              }
            }
          } finally {
            await pool.end();
          }
          if (!connected) throw new Error('PostgreSQL 17 did not become ready within 30 seconds');
          process.stdout.write('PostgreSQL 17 is ready\n');
          NODE
      - name: Assert PostgreSQL 17 and independent database sessions
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import pg from 'pg';
          const url = new URL(process.env.TEST_DATABASE_URL);
          assert.equal(url.hostname, 'localhost');
          assert.equal(url.pathname, '/lex_test');
          assert.equal(process.env.DATABASE_URL, process.env.TEST_DATABASE_URL);
          const pool = new pg.Pool({ connectionString: url.href, max: 2, connectionTimeoutMillis: 5000 });
          let first;
          let second;
          try {
            first = await pool.connect();
            second = await pool.connect();
            const query = "SELECT pg_backend_pid() AS pid, current_setting('server_version_num')::int AS version";
            const [a, b] = await Promise.all([first.query(query), second.query(query)]);
            assert.equal(Math.floor(a.rows[0].version / 10000), 17);
            assert.equal(Math.floor(b.rows[0].version / 10000), 17);
            assert.notEqual(a.rows[0].pid, b.rows[0].pid);
            console.log('Verified PostgreSQL 17 with two independent concurrent sessions');
          } finally {
            first?.release();
            second?.release();
            await pool.end();
          }
          NODE
      - name: Create existing 001-002 installation using Render migration runner
        shell: bash
        run: |
          temp_dir="$(mktemp -d)"
          migrations=(003_merchant_shipment_integration.sql 004_canonical_webhook_delivery.sql 005_merchant_authorization.sql)
          for migration in "${migrations[@]}"; do
            mv "migrations/$migration" "$temp_dir/$migration"
          done
          restore_migration() {
            for migration in "${migrations[@]}"; do
              if [[ -f "$temp_dir/$migration" ]]; then
                mv "$temp_dir/$migration" "migrations/$migration"
              fi
            done
            rmdir "$temp_dir"
          }
          trap restore_migration EXIT
          npm run migrate:prod
          node scripts/verify-postgres-migration.mjs seed
          for migration in "${migrations[@]}"; do
            mv "$temp_dir/$migration" "migrations/$migration"
          done
          rmdir "$temp_dir"
          trap - EXIT
      - name: Apply migrations 003 through 005 through Render production command
        run: npm run migrate:prod
      - name: Verify upgrade and preservation of Shipment, legacy event and destination
        run: node scripts/verify-postgres-migration.mjs verify
      - name: Verify production migration command is safe to rerun
        run: |
          npm run migrate:prod
          node scripts/verify-postgres-migration.mjs verify
      - name: Run PostgreSQL 17 application and legacy integration tests
        run: npm test
