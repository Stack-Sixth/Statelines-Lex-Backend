services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lex
      POSTGRES_PASSWORD: lex_local_only
      POSTGRES_DB: lex
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - lex_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lex -d lex']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  lex_dev_data:
